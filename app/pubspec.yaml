name: registro_riesgos_sm
description: "Registro de Riesgos Santa Marta — participación ciudadana para reportar problemáticas urbanas."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend (Auth, PostgreSQL, Storage, Realtime)
  supabase_flutter: ^2.8.0

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Mapas (OpenStreetMap por defecto; Mapbox configurable por variables)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Fotografías
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1

  # Modo sin conexión
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1

  # Notificaciones locales
  flutter_local_notifications: ^18.0.1

  # Gráficos y utilidades
  fl_chart: ^0.69.2
  intl: any  # versión fijada por flutter_localizations
  uuid: ^4.5.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
